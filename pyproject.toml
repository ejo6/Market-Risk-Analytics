[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "mra"
version = "0.1.0"
description = "Market risk analytics: C++ core with Python bindings"
requires-python = ">=3.11"   # datetime.UTC
dependencies = [
    "duckdb>=2.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "pyarrow>=17",
]

[project.scripts]
mra-ingest = "mra.ingest.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.13", "scikit-learn>=1.5"]  # parity references

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/mra"]
cmake.build-type = "Release"

[tool.pytest.ini_options]
testpaths = ["tests/python"]
